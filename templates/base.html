<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QuizLens{% endblock %} — Student Quiz Performance Analysis</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .stat-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.15s ease-in-out;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .badge-flagged {
            background-color: #dc3545;
            color: #fff;
        }
        .badge-safe {
            background-color: #198754;
            color: #fff;
        }
        .table th {
            background-color: #f1f3f5;
        }
        footer {
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-primary-emphasis fw-bold" href="/">
                🔍 QuizLens
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'dashboard' %}active text-white fw-bold{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'students' %}active text-white fw-bold{% endif %}" href="/students">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'quizzes' %}active text-white fw-bold{% endif %}" href="/quizzes">Quizzes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'questions' %}active text-white fw-bold{% endif %}" href="/questions">Questions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_page == 'topics' %}active text-white fw-bold{% endif %}" href="/topics">Topics</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-light small">
                    <span class="badge bg-secondary me-2">Demonstration Mode</span>
                    <span>30 Students &bull; 3 Quizzes</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 text-center text-muted">
        <div class="container">
            <small>QuizLens — Student Quiz Performance Analysis System (Beginner-Friendly Demonstration Project)</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
